<html>

<head>
    <title>New Tab</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="script.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

</head>

<body>
    <div class="mx-auto min-w-10">
        <img id="image" src="../landing_page/src/assets/pog_final.png">

            <div id="border"></div>
        </div>
    </div>
    
    <!-- Button containers -->
    <div class="">

            <button class="" onclick="openTools()">
                <img src="../landing_page/src/assets/icons/calendar-icon.png" alt="Tools Icon" class="icon">
            </button>
            <button class="" onclick="openCourses()">
                <img src="../landing_page/src/assets/icons/apple-icon.png" alt="Phone Icon" class="icon">
            </button>
        </div>
        
        <div class="button-container">
            <button id="openBookmarksButton">Read Something Interesting</button>
        </div>
    </div>

</html>
